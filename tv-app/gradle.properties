# Pin daemon memory: the gate runs testDebugUnitTest, lintDebug and
# assembleDebug in one daemon, whose measured clean-run metaspace peak is
# roughly 260-288 MiB. Gradle's 384 MiB default left too little headroom and
# intermittently died with OutOfMemoryError: Metaspace on loaded machines.
# Floor enforced by tools/ci/tests/test_tvapp_gradle_memory.py.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
