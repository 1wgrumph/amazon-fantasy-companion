name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      spec: ${{ steps.filter.outputs.spec }}
      docs: ${{ steps.filter.outputs.docs }}
      tvapp: ${{ steps.filter.outputs.tvapp }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          token: ''
          base: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref }}
          filters: |
            spec:
              - 'spec/**'
              - 'tools/spec/**'
              - 'tools/ci/**'
              - '.githooks/**'
              - '.github/workflows/**'
            docs:
              - 'docs/**'
              - '**/*.md'
              - 'tools/ci/**'
              - '.githooks/**'
              - '.github/workflows/**'
            tvapp:
              - 'tv-app/**'
              - 'tools/ci/**'
              - '.githooks/**'
              - '.github/workflows/**'
            backend:
              - 'backend/**'
              - 'tools/ci/**'
              - '.githooks/**'
              - '.github/workflows/**'
  spec:
    name: gate / spec
    needs: changes
    if: ${{ needs.changes.outputs.spec == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.6'
          checksum: '0c6bab77a67a445dc849ed5e8ee8d3cb333b6e2eba863643ce1e228075f27943'
          enable-cache: false
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: bash tools/ci/gate.sh spec
  docs:
    name: gate / docs
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - run: bash tools/ci/gate.sh docs
  tvapp:
    name: gate / tvapp
    needs: changes
    if: ${{ needs.changes.outputs.tvapp == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      # Never enable the cache input: bundled glob DoS advisories are reachable only through it.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - run: bash tools/ci/gate.sh tvapp
  backend:
    name: gate / backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      # Never enable the cache input: bundled glob DoS advisories are reachable only through it.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3.12 -m pip install --require-hashes -r backend/requirements-dev.txt
      - run: bash tools/ci/gate.sh backend
  hygiene:
    name: gate / hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.6'
          checksum: '0c6bab77a67a445dc849ed5e8ee8d3cb333b6e2eba863643ce1e228075f27943'
          enable-cache: false
      # Never enable the cache input: bundled glob DoS advisories are reachable only through it.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: python3.12 -m pip install --require-hashes -r tools/ci/requirements-hygiene.txt
      - run: bash tools/ci/gate.sh hygiene
