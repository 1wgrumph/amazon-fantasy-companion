<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1110" width="1000" height="1110" role="img" aria-label="V3 operational flow view of the Amazon Fantasy Companion">
<title>MODEL-AFC-V3 — Operational flow: alert path, panel refresh path, Mode B and Mode A branch (diagram-assisted, no SysML claim)</title>
<desc>Alert path from scheduled ESPN polling through normalization, matching, alert policy, long-poll delivery, heads-up notification, Watch, provider resolution and launch outcome. Panel refresh path and the spike SP-4 branch between Mode B and Mode A.</desc>
