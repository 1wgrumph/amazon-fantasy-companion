<text x="610" y="400" font-size="14" font-weight="bold">Panel route (spike SP-4)</text>
<polygon points="797,418 967,450 797,482 627,450" fill="#fff7e0" stroke="#b7791f" stroke-width="1.5"/>
<text x="797" y="447" text-anchor="middle" font-size="12">SP-4 route verdict within</text>
<text x="797" y="462" text-anchor="middle">spike_panel_max (≤ 24 h)?</text>
<text x="716" y="497" text-anchor="end" font-size="10">pass</text>
<text x="872" y="497" font-size="10">fail or timeout</text>

<rect x="610" y="520" width="180" height="150" fill="#eaf7ea" stroke="#2f855a" stroke-width="1.5"/>
<text x="620" y="538" font-size="12" font-weight="bold">Mode B</text>
<text x="620" y="555">Panel beside the provider's</text>
<text x="620" y="570">own video: picture-in-picture,</text>
<text x="620" y="585">split / multi-window, or</text>
<text x="620" y="600">provider integration.</text>
<text x="620" y="619" fill="#b91c1c">No system overlay covering</text>
<text x="620" y="634" fill="#b91c1c">the video (not acceptable).</text>

<rect x="805" y="520" width="180" height="150" fill="#eaf7ea" stroke="#2f855a" stroke-width="1.5"/>
<text x="815" y="538" font-size="12" font-weight="bold">Mode A (C5)</text>
<text x="815" y="555">CompanionPlayer: Media3</text>
<text x="815" y="570">ExoPlayer, CC-BY / CC0 clip</text>
<text x="815" y="585">labeled 'Sample footage —</text>
<text x="815" y="600">not a live broadcast', fitted</text>
<text x="815" y="615">left of the panel, aspect kept.</text>
<text x="815" y="634">Limitation stated in</text>
<text x="815" y="649">the submission.</text>

<rect x="610" y="690" width="375" height="44" fill="#f3f3f3" stroke="#777777" stroke-width="1.5"/>
<text x="620" y="708">Both modes: alerts and Watch still target the real</text>
<text x="620" y="724">provider apps; only the panel's video source differs.</text>

