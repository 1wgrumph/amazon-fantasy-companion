<text x="500" y="46" text-anchor="middle" fill="#444444">Planned design, not realized. diagram-assisted view; no SysML claim.</text>
<text x="30" y="70" font-size="14" font-weight="bold">Alert path</text>
<text x="610" y="70" font-size="14" font-weight="bold">Panel refresh path</text>

