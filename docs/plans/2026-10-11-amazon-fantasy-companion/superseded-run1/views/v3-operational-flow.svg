<text x="192" y="651" font-weight="bold" fill="#b91c1c">TB1: HTTPS + per-device bearer token</text>
<text x="192" y="670" fill="#444444">backend above, tv-app below</text>

<text x="188" y="281" font-size="10">yes</text>
<text x="324" y="229" text-anchor="middle" font-size="10">no / down</text>
<text x="188" y="583" font-size="10">yes</text>
