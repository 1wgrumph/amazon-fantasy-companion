<text x="620" y="100" font-size="12" font-weight="bold">LineupPanel shown (tv-app)</text>
<text x="620" y="117">remote show / hide; team and league selection</text>
<text x="620" y="168" font-size="12" font-weight="bold">GET /v1/panel, periodic refresh (tv-app)</text>
<text x="620" y="185">HTTPS + bearer token (TB1)</text>
<text x="620" y="236" font-size="12" font-weight="bold">PanelService (backend)</text>
<text x="620" y="252">points = box-score stats × league scoring settings</text>
<text x="620" y="268">freshness timestamps; lineup from LineupConnector</text>
<text x="620" y="318" font-size="12" font-weight="bold">LineupPanel renders (tv-app)</text>
<text x="620" y="334">lineup, per-player points, game status, team total;</text>
<text x="620" y="350">stale or unavailable values marked</text>
