<text x="40" y="100" font-size="12" font-weight="bold">EventBridge Scheduler (backend)</text>
<text x="40" y="117">game window open</text>
<text x="40" y="168" font-size="12" font-weight="bold">FeedIngest (backend)</text>
<text x="40" y="185">poll ESPN scoreboard / summary</text>
<text x="370" y="168" font-size="12" font-weight="bold">ESPN public JSON (external)</text>
<text x="370" y="185" fill="#b91c1c">untrusted input (TB3)</text>
<text x="180" y="240" text-anchor="middle" font-size="12">Response valid?</text>
<text x="370" y="232" font-size="12" font-weight="bold">ReplaySource (backend)</text>
<text x="370" y="249">recorded fixtures, labeled replay (C2)</text>
<text x="40" y="306" font-size="12" font-weight="bold">Normalize to GameEvent (backend)</text>
<text x="40" y="323">dedupe; scoring corrections</text>
<text x="40" y="374" font-size="12" font-weight="bold">Matcher (backend)</text>
<text x="40" y="390">player ↔ athlete identity; relevance to starters</text>
<text x="40" y="406">red zone = team context, not on-field proof</text>
<text x="370" y="381" font-size="12" font-weight="bold">LineupConnector (backend)</text>
<text x="370" y="398">Yahoo | Manual at T_yahoo (C6)</text>
<text x="40" y="456" font-size="12" font-weight="bold">AlertPolicy (backend)</text>
<text x="40" y="472">prefs, quiet hours, spoiler delay, frequency cap,</text>
<text x="40" y="488">duplicate suppression, corrections</text>
<text x="180" y="542" text-anchor="middle" font-size="12">Deliver now?</text>
<text x="370" y="534" font-size="12" font-weight="bold">Suppressed or delayed</text>
<text x="370" y="551">recorded; nothing sent</text>
<text x="40" y="608" font-size="12" font-weight="bold">Alert queued (backend, DynamoDB)</text>
<text x="40" y="625">/v1/alerts long-poll returns</text>
<text x="40" y="696" font-size="12" font-weight="bold">AlertService (tv-app, foreground)</text>
<text x="40" y="713">long-polls only in enabled viewing periods</text>
<text x="40" y="764" font-size="12" font-weight="bold">AlertNotifier (tv-app)</text>
<text x="40" y="781">Fire OS heads-up notification: Watch / Dismiss</text>
<text x="180" y="836" text-anchor="middle" font-size="12">Customer action?</text>
<text x="370" y="828" font-size="12" font-weight="bold">Dismissed</text>
<text x="370" y="845">nothing launched</text>
<text x="40" y="902" font-size="12" font-weight="bold">WatchLauncher (tv-app)</text>
<text x="40" y="919">GET /v1/providers over TB1</text>
<text x="370" y="888" font-size="12" font-weight="bold">ProviderResolver (backend)</text>
<text x="370" y="904">broadcast → customer-available provider</text>
<text x="370" y="919">→ launch target (curated registry);</text>
<text x="370" y="934">unknown access stays unknown</text>
<text x="40" y="970" font-size="12" font-weight="bold">Explicit intent / deep link (tv-app)</text>
<text x="40" y="987">to an allow-listed provider package (TB4)</text>
<text x="40" y="1038" font-size="12" font-weight="bold">Provider app launch outcome (reported by WatchLauncher)</text>
<text x="40" y="1056">GAME_OPENED (claimable only from device observation) | PROVIDER_DETAILS | APP_HOME |</text>
<text x="40" y="1072">APP_ABSENT | ACCESS_UNKNOWN | PLAYBACK_DENIED</text>

