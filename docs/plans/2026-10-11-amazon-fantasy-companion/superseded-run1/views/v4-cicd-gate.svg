<text x="500" y="28" text-anchor="middle" font-size="17" font-weight="bold">V4 — CI/CD gate flow, D4 shared capability (MODEL-AFC-V4)</text>
<text x="500" y="46" text-anchor="middle" fill="#444444">Planned design, not realized. diagram-assisted view; no SysML claim.</text>

<g fill="#ffffff" stroke="#333333" stroke-width="1.5">
<rect x="20" y="70" width="300" height="120"/>
<rect x="350" y="70" width="300" height="120"/>
<rect x="680" y="70" width="300" height="120"/>
