<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" role="img" aria-label="V4 CI/CD gate flow view for the D4 shared capability">
<title>MODEL-AFC-V4 — CI/CD gate flow: one gate script reached from git hooks, GitHub Actions and harness hooks, with the vnv-review branch (diagram-assisted, no SysML claim)</title>
<desc>Local git hooks, the GitHub Actions workflow and harness hooks through a shared hook script all run tools/ci/gate.sh. The gate runs the android, backend, spec and hygiene areas. On pass, ship-pull-request runs vnv-review when docs/vnv/AGENTS.md exists, otherwise records REFUSED_NO_VNV.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker>
</defs>
