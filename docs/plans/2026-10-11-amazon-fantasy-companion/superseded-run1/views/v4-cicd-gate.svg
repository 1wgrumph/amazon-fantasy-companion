<text x="32" y="92" font-size="13" font-weight="bold">Local git hooks</text>
<text x="32" y="110">.githooks/ — pre-commit, pre-push</text>
<text x="32" y="126">run the same gate command as CI</text>
<text x="362" y="92" font-size="13" font-weight="bold">GitHub Actions</text>
<text x="362" y="110">.github/workflows/ci.yml</text>
<text x="362" y="126">pull_request only, never pull_request_target (C14)</text>
<text x="362" y="142">stable check names · concurrency groups</text>
<text x="362" y="158">path filters · SHA-pinned actions</text>
<text x="362" y="174">least-privilege permissions; forks get no secrets</text>
<text x="692" y="92" font-size="13" font-weight="bold">Harness hooks</text>
<text x="692" y="110">Claude Code · Codex · Muse · Cursor · AGY</text>
<text x="692" y="126">start only after the D4 skill extensions land (C13)</text>
<text x="692" y="142" fill="#555555">Muse skills folder is empty today: known gap</text>
<text x="692" y="235" font-size="12" font-weight="bold">Shared hook script</text>
<text x="692" y="252">owner's shared skills / hooks repository</text>

<rect x="300" y="290" width="400" height="56" fill="#e8f0fe" stroke="#1a56db" stroke-width="2"/>
<rect x="304" y="294" width="392" height="48" fill="none" stroke="#1a56db" stroke-width="1"/>
<text x="500" y="314" text-anchor="middle" font-size="14" font-weight="bold">tools/ci/gate.sh</text>
<text x="500" y="332" text-anchor="middle">one gate script per repo; identical result from every entry point</text>

