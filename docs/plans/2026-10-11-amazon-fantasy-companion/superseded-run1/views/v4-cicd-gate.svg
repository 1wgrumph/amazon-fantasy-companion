<text x="712" y="672">typed gap, never treated as a pass (C12)</text>

<rect x="300" y="720" width="400" height="50" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="500" y="740" text-anchor="middle" font-size="12" font-weight="bold">Merge when required checks are green</text>
<text x="500" y="757" text-anchor="middle">rebase or merge commit; never squash</text>

