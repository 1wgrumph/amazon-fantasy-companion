<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" width="1000" height="1100" role="img" aria-label="V4 delivery tooling flow: D4 shared CI/CD gate and D5 shared spec-authoring skill">
<title>MODEL-AFC-V4 — Delivery tooling flow: one gate entrypoint reached from git hooks, GitHub Actions and harness hooks; vnv-review branch; D5 spec-authoring skill to vendored tools/spec to the spec gate area to the D1 build (diagram-assisted, no SysML claim)</title>
<desc>Local git hooks, the GitHub Actions workflow, and harness pre-tool hooks through the shared hook script Alphazedehq:hooks/ci-gate-hook.sh all run tools/ci/gate.sh with an area: android, backend, spec, hygiene. On pass, ship-pull-request runs vnv-review when a Vnv guidance tree exists, otherwise records REFUSED_NO_VNV as a typed gap. The D5 lane generalizes the GridMarket spec kit into Alphazedehq:skills/spec-authoring, vendors its scripts into tools/spec, and the spec gate area lints and builds the D1 specification.</desc>
