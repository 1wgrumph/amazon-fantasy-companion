<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1100" width="1000" height="1100" role="img" aria-label="V4 Phase 1 delivery tooling flow: D4 shared CI/CD gate with spec, docs, hygiene areas and D5 shared spec-authoring skill">
<title>MODEL-AFC-V4 — Phase 1 delivery tooling flow: one gate entrypoint (areas spec, docs, hygiene) reached from git hooks, GitHub Actions and harness hooks; vnv-review branch; D5 spec-authoring skill to S42 vendored tools/spec to the spec gate area; D1 is a dashed spec-track consumer (diagram-assisted, no SysML claim)</title>
<desc>Phase 1 only. Local git hooks, the GitHub Actions workflow (pull_request and push to main), and harness pre-tool hooks through the shared hook script Alphazedehq:hooks/ci-gate-hook.sh all run tools/ci/gate.sh with an area: spec, docs, hygiene. Phase 2 adds android and backend areas behind the same entrypoint. On pass, ship-pull-request runs vnv-review when a Vnv guidance tree exists, otherwise records REFUSED_NO_VNV as a typed gap. The D5 lane generalizes the GridMarket spec kit into Alphazedehq:skills/spec-authoring, vendors its scripts into tools/spec via the S42 vendor step, and the spec gate area lints and rebuilds each spec directory or, while none exists, self-checks the vendored template. D1 is built in spec-track step ST-4 (Phase 1).</desc>
