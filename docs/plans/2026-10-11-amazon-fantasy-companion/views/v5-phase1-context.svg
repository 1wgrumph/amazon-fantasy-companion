<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img" aria-label="V5 Phase 1 context: this repo, shared skills, harnesses, GitHub Actions, GridMarket source, spec-track consumer">
<title>MODEL-AFC-V5 — Phase 1 context and boundary: this repo uses the D4/D5 shared skills from private Alphazedehq; agents commit through harness hooks; CI runs on GitHub-hosted runners; GridMarket is the read-only D5 source; the spec track (D1, ST-4) consumes the vendored tools and the gate (diagram-assisted, no SysML claim)</title>
<desc>Phase 1 only. The GridMarket spec kit is generalized into the Alphazedehq shared skills, which author this repo's gate and workflow and vendor the spec tools via S42. Agents on five harnesses commit through local or harness hooks. The Actions workflow runs on GitHub-hosted runners with no secrets to forks. Spec-track step ST-4 builds D1 with the D5 skill and the spec gate area.</desc>
