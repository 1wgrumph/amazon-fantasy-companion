<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820" role="img" aria-label="V1 context and trust boundary view of the Amazon Fantasy Companion">
<title>MODEL-AFC-V1 — Context and trust boundaries (diagram-assisted, no SysML claim)</title>
<desc>Planned system boundary: tv-app on the owner's Fire TV stick and backend in the owner's AWS Free-plan account. External actors and systems, and trust boundaries TB1 to TB4.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker>
</defs>
