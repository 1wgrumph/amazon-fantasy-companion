<text x="258" y="150">ProfileSettings (items 1, 6)</text>
<text x="258" y="169">AppDetector (installed ≠ subscribed)</text>
<text x="258" y="188">AlertService (foreground)</text>
<text x="258" y="207">AlertNotifier (heads-up)</text>
<text x="258" y="226">WatchLauncher (launch outcome)</text>
<text x="258" y="245">LineupPanel (right side)</text>
