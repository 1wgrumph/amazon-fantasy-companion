<line x1="300" y1="405" x2="300" y2="500" stroke="#1a56db" stroke-width="2.5" marker-end="url(#a)"/>
<text x="260" y="522" font-size="13" font-weight="bold">backend/ — SYSTEM</text>
<text x="260" y="538" font-size="11" fill="#333333">Python 3.12 Lambda · API Gateway HTTP API · AWS SAM</text>
<text x="260" y="564">DeviceAuth (device code)</text>
<text x="260" y="584">FeedIngest + ReplaySource</text>
<text x="260" y="604">LineupConnector</text>
<text x="272" y="624" font-size="11">YahooSource | ManualSource</text>
<text x="260" y="644">Matcher</text>
<text x="260" y="664">AlertPolicy</text>
<text x="460" y="564">ProviderResolver + registry</text>
<text x="460" y="584">PanelService</text>
<text x="460" y="604">DynamoDB (on-demand)</text>
<text x="460" y="624">EventBridge Scheduler</text>
<text x="460" y="644">SSM SecureString</text>
<text x="472" y="664" font-size="11">(Yahoo client secret)</text>
<text x="260" y="700" font-size="11">REST: /v1/link · /v1/profile · /v1/alerts · /v1/panel · /v1/providers</text>
<text x="260" y="720" font-size="11" fill="#444444">Yahoo tokens and client secret stay server-side (never in the APK)</text>
<text x="260" y="740" font-size="11" fill="#444444">ESPN responses validated at ingest; replay fixtures labeled (C2)</text>
<text x="260" y="760" font-size="11" fill="#444444">IaC: backend/template.yaml (AWS SAM)</text>

