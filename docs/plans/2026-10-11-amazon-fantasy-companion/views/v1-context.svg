<rect x="0" y="0" width="1000" height="820" fill="#ffffff"/>
<text x="500" y="28" text-anchor="middle" font-size="17" font-weight="bold">V1 — Context and trust boundaries (MODEL-AFC-V1)</text>
<text x="500" y="46" text-anchor="middle" font-size="11" fill="#444444">Planned design, not realized. diagram-assisted view; no SysML claim.</text>

