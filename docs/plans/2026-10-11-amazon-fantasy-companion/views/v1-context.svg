<text x="590" y="202" text-anchor="middle">Provider viewing</text>
<text x="590" y="218" text-anchor="middle">app(s) — external</text>
<text x="590" y="236" text-anchor="middle" font-size="11">one real provider</text>
<text x="590" y="252" text-anchor="middle" font-size="11">chosen in spike SP-3</text>
<text x="590" y="276" text-anchor="middle" font-size="10" font-weight="bold" fill="#b91c1c">TB4 target</text>

