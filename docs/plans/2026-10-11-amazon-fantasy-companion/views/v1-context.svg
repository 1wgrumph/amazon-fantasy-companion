<text x="702" y="216" font-weight="bold">Trust boundaries</text>
<text x="702" y="234" font-size="11">TB1  TV ↔ API: HTTPS, per-device bearer token</text>
<text x="702" y="252" font-size="11">TB2  Yahoo OAuth tokens + client secret in</text>
<text x="732" y="267" font-size="11">SSM SecureString, server-side only</text>
<text x="702" y="285" font-size="11">TB3  ESPN responses untrusted; validated</text>
<text x="732" y="300" font-size="11">at ingest</text>
<text x="702" y="318" font-size="11">TB4  Provider launch: explicit intent to an</text>
<text x="732" y="333" font-size="11">allow-listed package only</text>
