<text x="258" y="300" font-size="11" fill="#444444">minSdk 25 (starter sets 21)</text>
<text x="258" y="316" font-size="11" fill="#444444">No secrets in the APK</text>
<text x="258" y="332" font-size="11" fill="#444444">Starter: hello-world-fire-tv (MIT-0)</text>

<rect x="520" y="90" width="140" height="70" fill="#ffffff" stroke="#555555"/>
<text x="590" y="115" text-anchor="middle">Fire OS</text>
<text x="590" y="131" text-anchor="middle">notification system</text>
