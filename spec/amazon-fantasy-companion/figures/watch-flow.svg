<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Alert to Watch: derived operational sequence</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="380" fill="white" />
  <g class="line" data-id="life-be">
    <polyline points="80,60 80,360" fill="none" stroke="black" stroke-dasharray="4 4" />
  </g>
  <g class="line" data-id="life-tv">
    <polyline points="280,60 280,360" fill="none" stroke="black" stroke-dasharray="4 4" />
  </g>
  <g class="line" data-id="life-user">
    <polyline points="480,60 480,360" fill="none" stroke="black" stroke-dasharray="4 4" />
  </g>
  <g class="line" data-id="life-provider">
    <polyline points="680,60 680,360" fill="none" stroke="black" stroke-dasharray="4 4" />
  </g>
  <g class="line" data-id="msg-1">
    <polyline points="80,110 280,110" fill="none" stroke="black" marker-end="url(#arrow)" />
    <text x="180" y="106" text-anchor="middle">gated, delayed Alert + route</text>
  </g>
  <g class="line" data-id="msg-2">
    <polyline points="280,160 480,160" fill="none" stroke="black" marker-end="url(#arrow)" />
    <text x="380" y="156" text-anchor="middle">chosen presentation: Watch / Dismiss</text>
  </g>
  <g class="line" data-id="msg-3">
    <polyline points="480,210 280,210" fill="none" stroke="black" marker-end="url(#arrow)" />
    <text x="380" y="206" text-anchor="middle">Watch; confirmation if configured</text>
  </g>
  <g class="line" data-id="msg-4">
    <polyline points="280,260 680,260" fill="none" stroke="black" marker-end="url(#arrow)" />
    <text x="480" y="256" text-anchor="middle">supported game/channel URI or intent</text>
  </g>
  <g class="line" data-id="msg-5">
    <polyline points="280,310 480,310" fill="none" stroke="black" marker-end="url(#arrow)" />
    <text x="380" y="306" text-anchor="middle">reported RoutingOutcome; unknown stays unknown</text>
  </g>
  <g id="be">
    <rect x="20" y="20" width="120" height="40" fill="white" stroke="black" />
    <text x="80" y="44" text-anchor="middle">Backend policy / resolver</text>
  </g>
  <g id="tv">
    <rect x="220" y="20" width="120" height="40" fill="white" stroke="black" />
    <text x="280" y="44" text-anchor="middle">TV notifier / launcher</text>
  </g>
  <g id="user">
    <rect x="420" y="20" width="120" height="40" fill="white" stroke="black" />
    <text x="480" y="44" text-anchor="middle">Customer</text>
  </g>
  <g id="provider">
    <rect x="620" y="20" width="120" height="40" fill="white" stroke="black" />
    <text x="680" y="44" text-anchor="middle">Provider app</text>
  </g>
</svg>
